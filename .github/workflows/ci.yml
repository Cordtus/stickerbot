name: CI

on: push

permissions:
  contents: read

jobs:
  build:
    # Mirrors the nodev2 `cordtus-stickerbot` runner class labels.
    runs-on: [self-hosted, linux, x64, nodev2, docker, runner-class-cac]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
